name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Keep the pnpm store off a node_modules path
        # action-setup's default store is .../setup-pnpm/node_modules/.bin/store.
        # Preparing a git dependency there builds it inside a node_modules path,
        # where tsc emits CommonJS into the .mjs output — so the package's own
        # import check dies with "exports is not defined in ES module scope" and
        # the whole install fails. Must run before setup-node, which reads
        # `pnpm store path` to decide what to cache.
        run: pnpm config set store-dir "${RUNNER_TEMP}/pnpm-store" --location=global

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Check prettier formatting
        run: pnpm run prettier

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: pnpm run test:coverage

      - name: Build application
        env:
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          WORKOS_AUTHKIT_DOMAIN: ${{ secrets.WORKOS_AUTHKIT_DOMAIN }}
          LLAMA_CLOUD_BASE_URL: ${{ secrets.LLAMA_CLOUD_BASE_URL }}
        run: pnpm run build

      - name: Check for build artifacts
        run: |
          if [ ! -d ".next" ]; then
            echo "Build artifacts not found!"
            exit 1
          fi
          echo "Build completed successfully"
