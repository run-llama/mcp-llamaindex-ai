name: Publish image

# Publishes llamaindex/llamacloud-mcp for self-hosted and BYOC installs.
#
# Straight to Docker Hub rather than through the platform's central ECR: the
# BYOC release re-tags every mapped image from `<ecr>/<repo>:<platform promotion
# tag>`, and this repo has no platform tags. Routing through it would either
# fail that release with "image not found" or couple MCP's releases to the
# platform's promotion cadence. Publishing here keeps this repo releasable on
# its own, and the chart pins an explicit tag, so nothing has to resolve
# dynamically.
#
# The chart's `mcp.image` must name a tag published by this workflow. Its
# appVersion fallback is a chart-version tag, which this repo does not produce.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish, without the leading v (e.g. 0.1.0)'
        required: true
        type: string

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Presence only. This does not prove the token can push to the llamaindex/
      # namespace — a valid but unauthorised token still logs in and fails at the
      # end. It catches the common case (secrets never granted) before the build.
      - name: Require registry credentials
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "${USERNAME}" || -z "${TOKEN}" ]]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be set on this repository." \
              "Without them the image cannot be published and a BYOC install cannot pull it."
            exit 1
          fi

      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "${INPUT_TAG}" ]]; then
            version="${INPUT_TAG#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # A tag that is not a plain version would publish an image the chart
          # cannot reference, so refuse it rather than publish something odd.
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${version}' is not a semantic version."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing llamaindex/llamacloud-mcp:${version}"

      # A published tag is what a chart pins, so republishing it changes the code
      # under installs that were told the tag is immutable. Docker Hub overwrites
      # by default, so refuse it here.
      - name: Refuse an already-published version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/llamaindex/llamacloud-mcp/tags/${VERSION}/")
          # Only 404 proves the tag is free. Treating "anything but 200" as free
          # made this fail open: a 429 or a Docker Hub 5xx -- or a curl that never
          # connected, which reports 000 -- printed "unused" and published straight
          # over a tag customers may already have pinned. An outage is a reason to
          # retry the release, not to overwrite an image.
          case "$code" in
            200)
              echo "::error::llamaindex/llamacloud-mcp:${VERSION} is already published." \
                "Publish a new version rather than moving a tag customers may have pinned."
              exit 1
              ;;
            404)
              echo "Tag ${VERSION} is unused."
              ;;
            *)
              echo "::error::cannot tell whether ${VERSION} is already published" \
                "(HTTP ${code} from Docker Hub). Refusing to publish rather than risk" \
                "overwriting a pinned tag -- re-run once Docker Hub is answering."
              exit 1
              ;;
          esac

      # CI runs on main and on pull requests, not on tags, so tagging an
      # unmerged commit would publish code that never ran the suite.
      - name: Require the commit to be on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_SHA} is not an ancestor of origin/main." \
              "Only tag commits that have merged and been tested."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # arm64 as well as amd64: a BYOC cluster on Graviton is ordinary, and a
      # single-arch image fails to schedule there with a manifest error that
      # reads like a missing tag.
      #
      # Built to a local OCI layout first. Verifying after a push cannot prevent
      # the harm — the tag is already public and pullable as amd64-only, and the
      # gate above then refuses to republish it. Nothing reaches the registry
      # until both platforms are confirmed present.
      - name: Build both platforms
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/image.tar
          labels: |
            org.opencontainers.image.title=llamacloud-mcp
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Off because it adds `unknown/unknown` entries to the manifest list,
          # which read as a broken platform to some scanners and to the check below.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify both platforms before publishing
        run: |
          mkdir -p /tmp/oci && tar -xf /tmp/image.tar -C /tmp/oci
          python3 - <<'EOF'
          import json, pathlib, sys
          root = pathlib.Path("/tmp/oci")
          def blob(d):
              algo, digest = d.split(":")
              return json.loads((root / "blobs" / algo / digest).read_text())
          index = json.loads((root / "index.json").read_text())
          published = set()
          for m in index["manifests"]:
              entries = blob(m["digest"]).get("manifests", []) if m["mediaType"].endswith(
                  ("index.v1+json", "list.v2+json")) else [m]
              for e in entries:
                  p = e.get("platform", {})
                  # Provenance entries carry architecture "unknown" and must not
                  # stand in for a real platform.
                  if p.get("architecture") and p["architecture"] != "unknown":
                      published.add(f"{p['os']}/{p['architecture']}")
          missing = {"linux/amd64", "linux/arm64"} - published
          if missing:
              print(f"::error::built {sorted(published)}; missing {sorted(missing)} — not publishing")
              sys.exit(1)
          print(f"Verified {sorted(published)}; publishing.")
          EOF

      # Pushes the archive that was just verified, rather than rebuilding. The
      # credential is a push-only token scoped to this one repository, so it
      # cannot pull `library/node` — presenting it during a build makes every
      # base-image pull 401 where an anonymous pull succeeds. Authenticating
      # only here keeps the build anonymous and the token out of it entirely.
      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

      - name: Publish
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          skopeo copy --all \
            --dest-creds "${USERNAME}:${TOKEN}" \
            oci-archive:/tmp/image.tar \
            "docker://llamaindex/llamacloud-mcp:${VERSION}"

      # Reads back from the registry rather than trusting the push: this is the
      # only check that sees what a customer would actually pull.
      - name: Confirm the published image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          skopeo inspect --raw "docker://llamaindex/llamacloud-mcp:${VERSION}" > published.json
          python3 - <<'EOF'
          import json, sys
          d = json.load(open("published.json"))
          got = sorted({f"{m['platform']['os']}/{m['platform']['architecture']}"
                        for m in d.get("manifests", [])
                        if m.get("platform", {}).get("architecture") not in (None, "unknown")})
          missing = {"linux/amd64", "linux/arm64"} - set(got)
          if missing:
              print(f"::error::published image has {got}; missing {sorted(missing)}")
              sys.exit(1)
          print(f"Published and verified from the registry: {got}")
          EOF

      # The image is published and verified by this point. What follows is a
      # convenience: it asks the platform chart to pin the new version now,
      # rather than waiting for that repo's scheduled reconcile to notice.
      #
      # A published image reaches no self-hosted deployment until that pin moves,
      # so this is the step that turns a release into something customers can
      # actually get.
      #
      # Deliberately non-fatal, both of them. This version can never be published
      # again (the workflow refuses an already-published tag), so failing the run
      # over a downstream nudge would strand a good image behind a red workflow
      # and leave no way to retry it. The reconcile in run-llama/platform picks up
      # anything this misses.
      - name: Mint a token for the platform repo
        id: platform-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          owner: run-llama
          repositories: platform
          permission-actions: write

      - name: Ask the chart to pin this version
        if: steps.platform-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.platform-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # This workflow publishes prereleases (0.3.0-rc1 and friends); the chart
          # pin only ever advances to a full release, so nudging one would just log
          # a failed run over there for a version it is right to refuse.
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease ${VERSION}: not asking the chart to pin it"
            exit 0
          fi
          if gh workflow run bump-mcp-image.yml --repo run-llama/platform -f tag="${VERSION}"; then
            echo "asked run-llama/platform to pin ${VERSION}"
          else
            echo "::warning::could not trigger the chart pin bump for ${VERSION}; the scheduled reconcile in run-llama/platform will pick it up"
          fi
