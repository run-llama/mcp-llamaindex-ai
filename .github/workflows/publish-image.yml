name: Publish image

# Publishes llamaindex/llamacloud-mcp for self-hosted and BYOC installs.
#
# Straight to Docker Hub rather than through the platform's central ECR: the
# BYOC release re-tags every mapped image from `<ecr>/<repo>:<platform promotion
# tag>`, and this repo has no platform tags. Routing through it would either
# fail that release with "image not found" or couple MCP's releases to the
# platform's promotion cadence. Publishing here keeps this repo releasable on
# its own, and the chart pins an explicit tag, so nothing has to resolve
# dynamically.
#
# The chart's `mcp.image` must name a tag published by this workflow. Its
# appVersion fallback is a chart-version tag, which this repo does not produce.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish, without the leading v (e.g. 0.1.0)'
        required: true
        type: string

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Presence only. This does not prove the token can push to the llamaindex/
      # namespace — a valid but unauthorised token still logs in and fails at the
      # end. It catches the common case (secrets never granted) before the build.
      - name: Require registry credentials
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "${USERNAME}" || -z "${TOKEN}" ]]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be set on this repository." \
              "Without them the image cannot be published and a BYOC install cannot pull it."
            exit 1
          fi

      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "${INPUT_TAG}" ]]; then
            version="${INPUT_TAG#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # A tag that is not a plain version would publish an image the chart
          # cannot reference, so refuse it rather than publish something odd.
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${version}' is not a semantic version."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing llamaindex/llamacloud-mcp:${version}"

      # A published tag is what a chart pins, so republishing it changes the code
      # under installs that were told the tag is immutable. Docker Hub overwrites
      # by default, so refuse it here.
      - name: Refuse an already-published version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/llamaindex/llamacloud-mcp/tags/${VERSION}/")
          if [[ "$code" == "200" ]]; then
            echo "::error::llamaindex/llamacloud-mcp:${VERSION} is already published." \
              "Publish a new version rather than moving a tag customers may have pinned."
            exit 1
          fi
          echo "Tag ${VERSION} is unused (HTTP ${code})."

      # CI runs on main and on pull requests, not on tags, so tagging an
      # unmerged commit would publish code that never ran the suite.
      - name: Require the commit to be on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_SHA} is not an ancestor of origin/main." \
              "Only tag commits that have merged and been tested."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # arm64 as well as amd64: a BYOC cluster on Graviton is ordinary, and a
      # single-arch image fails to schedule there with a manifest error that
      # reads like a missing tag.
      #
      # Built to a local OCI layout first. Verifying after a push cannot prevent
      # the harm — the tag is already public and pullable as amd64-only, and the
      # gate above then refuses to republish it. Nothing reaches the registry
      # until both platforms are confirmed present.
      - name: Build both platforms
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/image.tar
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify both platforms before publishing
        run: |
          mkdir -p /tmp/oci && tar -xf /tmp/image.tar -C /tmp/oci
          python3 - <<'EOF'
          import json, pathlib, sys
          root = pathlib.Path("/tmp/oci")
          def blob(d):
              algo, digest = d.split(":")
              return json.loads((root / "blobs" / algo / digest).read_text())
          index = json.loads((root / "index.json").read_text())
          published = set()
          for m in index["manifests"]:
              entries = blob(m["digest"]).get("manifests", []) if m["mediaType"].endswith(
                  ("index.v1+json", "list.v2+json")) else [m]
              for e in entries:
                  p = e.get("platform", {})
                  # Provenance entries carry architecture "unknown" and must not
                  # stand in for a real platform.
                  if p.get("architecture") and p["architecture"] != "unknown":
                      published.add(f"{p['os']}/{p['architecture']}")
          missing = {"linux/amd64", "linux/arm64"} - published
          if missing:
              print(f"::error::built {sorted(published)}; missing {sorted(missing)} — not publishing")
              sys.exit(1)
          print(f"Verified {sorted(published)}; publishing.")
          EOF

      # Cache-only: every layer was produced by the build above, so this pushes
      # rather than rebuilds.
      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: llamaindex/llamacloud-mcp:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=llamacloud-mcp
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Off because it adds `unknown/unknown` entries to the manifest list,
          # which read as a broken platform to some scanners.
          provenance: false
          cache-from: type=gha
